# The 3-node HA choice: `kubectl apply -k deploy/k8s/overlays/ha`. Builds on top of base/ —
# same namespace, ConfigMap, Secret contract, Service, Ingress — and patches only what scaling
# out actually requires. See README.md in deploy/k8s ("Two shapes") for the full
# explanation of what each patch is for and what the cluster needs to provide.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Declared here as well as in base/: resources that exist only in this overlay (pdb.yaml)
# are not covered by base's namespace transformer, and a namespace-less PodDisruptionBudget
# would land in the caller's current context instead of protecting these pods.
namespace: ganesha

resources:
  - ../../base
  - pdb.yaml

patches:
  - path: deployment-ha.yaml
  - path: pvc-rwx.yaml
  - path: configmap-trustproxy.yaml
