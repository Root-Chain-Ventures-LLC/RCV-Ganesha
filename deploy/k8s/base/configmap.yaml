apiVersion: v1
kind: ConfigMap
metadata:
  name: ganesha
  labels:
    app.kubernetes.io/name: ganesha
data:
  # The public https:// URL people reach Ganesha at. The app itself never terminates TLS
  # or redirects — this value only decides whether session cookies
  # get the Secure flag and whether the CSP sends HSTS/upgrade-insecure-requests. Get it
  # wrong (e.g. leave it http://) and cookies are issued without Secure over a connection
  # that is, from the browser's point of view, https — some browsers will still accept
  # them, but it's a real weakening, not just cosmetic.
  BASE_URL: "https://ganesha.example.com"

  # These manifests put an ingress in front of the pod that terminates TLS and talks
  # plain HTTP to it (see ingress.yaml) — so the app must trust the ingress's
  # X-Forwarded-* headers. "1" = trust exactly one proxy hop (the ingress controller),
  # so a client cannot spoof its address with its own X-Forwarded-For. Use "2" if a cloud
  # load balancer sits in front of the ingress controller, or a comma-separated list of
  # the ingress/LB CIDRs instead. "true" trusts every hop (avoid). Leave "false" only for
  # a deployment with no reverse proxy in front of the pod at all.
  TRUST_PROXY: "1"

  DATA_DIR: "/data"
