apiVersion: apps/v1
kind: Deployment
metadata:
  name: ganesha
  labels:
    app.kubernetes.io/name: ganesha
spec:
  replicas: 1
  # Never more than one pod on this volume. DATA_DIR (synced photos, uploaded vehicle
  # photos, record/card attachments, pending smart-upload files) lives as plain files on
  # one ReadWriteOnce PVC with one writer. Migrations themselves are *not* the blocker —
  # they run on every start under a Postgres advisory lock, so two instances racing to
  # migrate is already safe — but two pods both trying to mount the same RWO volume, or
  # both writing attachments to what should be one directory tree, is not. To run more
  # than one replica use overlays/ha (a ReadWriteMany volume) instead of raising `replicas`
  # here; `strategy: Recreate` (below) is what keeps an upgrade from briefly running two
  # pods against the same volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ganesha
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ganesha
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # The image's /data is owned by uid 1000 (the Dockerfile's `node` user); fsGroup
        # makes a freshly provisioned volume writable by it.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ganesha
          # Pinned to a published release; to upgrade, change the tag and re-apply. Releases
          # are listed at https://github.com/Root-Chain-Ventures-LLC/RCV-Ganesha/releases
          image: ghcr.io/root-chain-ventures-llc/ganesha:0.1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # DATABASE_URL (your Postgres — see README.md and create-db.sql in this
          # directory) and GANESHA_SECRET_KEY belong in the ganesha Secret.
          envFrom:
            - configMapRef:
                name: ganesha
            - secretRef:
                name: ganesha
          env:
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          # The app answers plain HTTP only — it never terminates TLS itself. The ingress
          # in front of it (ingress.yaml) is what's HTTPS.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            # Generous: migrations run against an empty database on first start, under
            # the advisory lock mentioned above, and the HTTP listener doesn't open until
            # that finishes.
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              # Headroom for smart upload: PDF pages are rasterised in-process, and that
              # is the heaviest thing the app does per request. Tune from real usage.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ganesha-data
        - name: tmp
          emptyDir: {}
