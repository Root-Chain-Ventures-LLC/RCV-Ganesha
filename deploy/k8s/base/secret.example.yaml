# Template only — do not commit real values. Create the live Secret out of band, e.g.
#
#   kubectl -n ganesha create secret generic ganesha \
#     --from-literal=DATABASE_URL="postgres://ganesha:<password>@<cluster-postgres-host>:5432/ganesha" \
#     --from-literal=GANESHA_SECRET_KEY="$(openssl rand -base64 32)"
#
# DATABASE_URL and GANESHA_SECRET_KEY are the two required secrets. Ganesha has no
# SESSION_SECRET (or equivalent) to set: sessions are opaque random tokens the server
# stores (hashed) in its own `sessions` table and validates on every request — there is
# no signing key, so nothing needs to survive a restart or a pod rescheduling for
# sessions to keep working, other than the database itself.
#
# GANESHA_SECRET_KEY (32 bytes, base64 or 64 hex chars — `openssl rand -base64 32`) is
# the master key Ganesha encrypts every settings credential with before writing it to
# Postgres — directory/SSO client secrets, the Geotab service account
# password, the SMTP password, Document AI provider API keys, all still configured in
# the Ganesha UI (Settings, admin-only) and never a separate environment variable per
# integration, encrypted at rest in the `settings` table.
# The app refuses to start without this key (NODE_ENV=production, which this image
# always runs with). Losing it makes every already-stored secret unrecoverable — back
# it up the same way you'd back up the database itself. Rotating it is
# `GANESHA_SECRET_KEY_PREVIOUS` (comma-separated former keys) plus
# `node server/dist/index.js rotate-secrets` in the pod — see README.md in this
# directory ("Secrets").
#
# A database dump of the `settings` table contains ciphertext only; that protects a
# leaked backup, not a compromised running pod.
apiVersion: v1
kind: Secret
metadata:
  name: ganesha
  labels:
    app.kubernetes.io/name: ganesha
type: Opaque
stringData:
  DATABASE_URL: ""
  GANESHA_SECRET_KEY: ""
